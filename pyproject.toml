[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanket-setu"
version = "0.1.0"
description = "Limited-vocabulary ISL sign-recognition and communication-support prototype"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.8.0.76",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "pillow>=10.0.0",
    "gTTS>=2.4.0",
    "SpeechRecognition>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
