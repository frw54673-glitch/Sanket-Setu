[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanket-setu"
version = "0.1.0"
description = "Limited-vocabulary ISL sign-recognition and communication-support prototype"
requires-python = ">=3.10,<=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
